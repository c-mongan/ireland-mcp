# Ireland MCP eval: does a model pick the right tools for Irish questions?
# Run locally only:  npm run build && OPENAI_API_KEY=... npm run eval
# Azure OpenAI:      AZURE_API_KEY=... AZURE_API_HOST=... AZURE_DEPLOYMENT=... npm run eval
# scripts/eval.mjs skips (exit 0) when no OPENAI_API_KEY is set, so CI never runs it.
# Surface: default meta tools; EVAL_TOOLSETS=all (or cso,irish-rail) adds typed tools via --toolsets.
# tool-calls.mjs reduces each transcript to the tools called; ireland_call {operation: X} counts as X.
description: Ireland MCP tool selection
prompts:
  - "You answer questions about Ireland using only the tools provided. Cite the source and licence. Question: {{question}}"
providers:
  - id: openai:chat:gpt-4.1-mini
    config:
      temperature: 0
      mcp:
        enabled: true
        timeout: 60000
        server:
          command: node
          args: ["dist/src/cli.js"]
defaultTest:
  options:
    provider: openai:chat:gpt-4.1-mini
    transform: file://tool-calls.mjs
tests:
  - vars:
      question: "What was the population of County Galway in the last census?"
    assert:
      - type: icontains-any
        value: [cso_area_profile, ireland_snapshot, cso_get_data]
  - vars:
      question: "Find CSO tables about rents."
    assert:
      - type: icontains-any
        value: [cso_search_tables, search]
  - vars:
      question: "What dimensions does CSO table F1001 have?"
    assert:
      - type: icontains-any
        value: [cso_get_table_metadata]
  - vars:
      question: "How many people lived in Cork county in 2016 according to the census?"
    assert:
      - type: icontains-any
        value: [cso_area_profile, cso_get_data]
  - vars:
      question: "Search Irish statistics for unemployment tables."
    assert:
      - type: icontains-any
        value: [cso_search_tables, search]
  - vars:
      question: "Find Eurostat datasets about population for Ireland."
    assert:
      - type: icontains-any
        value: [eurostat_search_datasets, search]
  - vars:
      question: "Get Ireland's 2024 population from Eurostat dataset demo_pjan."
    assert:
      - type: icontains-any
        value: [eurostat_get_data]
  - vars:
      question: "Compare Ireland with the EU27 in a Eurostat population dataset."
    assert:
      - type: icontains-any
        value: [eurostat_compare_ie_eu, eurostat_get_data]
  - vars:
      question: "What is the latest ECB euro to US dollar exchange rate?"
    assert:
      - type: icontains-any
        value: [ecb_exchange_rate, ecb_get_series]
  - vars:
      question: "Show the latest ECB main refinancing rate."
    assert:
      - type: icontains-any
        value: [ecb_interest_rates, ecb_get_series]
  - vars:
      question: "Fetch ECB series FM.B.U2.EUR.4F.KR.MRR_FR.LEV."
    assert:
      - type: icontains-any
        value: [ecb_get_series]
  - vars:
      question: "Look up Galway as an Irish place in Wikidata."
    assert:
      - type: icontains-any
        value: [wikidata_place]
  - vars:
      question: "Summarise Wikidata entity Q27."
    assert:
      - type: icontains-any
        value: [wikidata_entity]
  - vars:
      question: "Find the Irish name and coordinates for Cork in Wikidata."
    assert:
      - type: icontains-any
        value: [wikidata_place]
  - vars:
      question: "Which TDs are members for Dublin Bay South?"
    assert:
      - type: icontains-any
        value: [oireachtas_search_members]
  - vars:
      question: "Find bills before the Oireachtas about housing."
    assert:
      - type: icontains-any
        value: [oireachtas_search_bills, search]
  - vars:
      question: "What was debated in the Dáil most recently?"
    assert:
      - type: icontains-any
        value: [oireachtas_get_debates]
  - vars:
      question: "Find recent parliamentary questions about hospital waiting lists."
    assert:
      - type: icontains-any
        value: [oireachtas_search_questions]
  - vars:
      question: "How did the most recent Dáil divisions go?"
    assert:
      - type: icontains-any
        value: [oireachtas_get_votes]
  - vars:
      question: "Which enacted bills from 2024 mention climate?"
    assert:
      - type: icontains-any
        value: [oireachtas_search_bills]
  - vars:
      question: "Which county and electoral division contain 53.27, -9.05?"
    assert:
      - type: icontains-any
        value: [geohive_boundaries_at_point, nearby]
  - vars:
      question: "List the GeoHive layers you can query."
    assert:
      - type: icontains-any
        value: [geohive_list_layers]
  - vars:
      question: "Which local electoral area is the Spire in Dublin (53.3498, -6.2603) in?"
    assert:
      - type: icontains-any
        value: [geohive_boundaries_at_point, nearby]
  - vars:
      question: "Find planning applications for apartments near the Spire in Dublin."
    assert:
      - type: icontains-any
        value: [planning_search]
  - vars:
      question: "Look up planning application WEB1741/25."
    assert:
      - type: icontains-any
        value: [planning_get]
  - vars:
      question: "What Census 2022 small area and population contain 53.3498, -6.2603?"
    assert:
      - type: icontains-any
        value: [census_small_area_at]
  - vars:
      question: "What recorded archaeological monuments are near Dublin Castle?"
    assert:
      - type: icontains-any
        value: [heritage_monuments_near]
  - vars:
      question: "Are there SAC or SPA protected sites near North Bull Island?"
    assert:
