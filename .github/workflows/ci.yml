name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Validate Azure domain deployment ordering
        run: node --test test/infra-arm.mjs
      - run: npm run build
      - name: MCP Inspector conformance (stdio)
        run: npm run inspector:check
