name: Deploy docs site

# Publishes web/ to the swa-ireland-mcp Static Web App whenever it changes on main.
# Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN
# (az staticwebapp secrets list -n swa-ireland-mcp -g rg-ireland-mcp --query properties.apiKey -o tsv).
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web
          skip_app_build: true
          skip_api_build: true
