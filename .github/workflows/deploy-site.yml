name: Deploy docs site

# Publishes web/ to the swa-ireland-mcp Static Web App whenever it changes on main.
# Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN
# (az staticwebapp secrets list -n swa-ireland-mcp -g rg-ireland-mcp --query properties.apiKey -o tsv).
on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/prepare-analytics.mjs", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prepare optional usage metrics
        env:
          IRELAND_MCP_POSTHOG_WEB_ENABLED: "true"
          IRELAND_MCP_POSTHOG_KEY: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          IRELAND_MCP_POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://eu.i.posthog.com' }}
          IRELAND_MCP_RELEASE: ${{ github.sha }}
        run: node scripts/prepare-analytics.mjs
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web
          skip_app_build: true
          skip_api_build: true
