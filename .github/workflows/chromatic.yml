name: Chromatic

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "storybook/**"
      - ".storybook/**"
      - ".github/workflows/chromatic.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-storybook-mcp.mjs"
  pull_request:
    paths:
      - "web/**"
      - "storybook/**"
      - ".storybook/**"
      - ".github/workflows/chromatic.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-storybook-mcp.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:storybook
      - run: npm run test:storybook-mcp
      - run: npm run build-storybook
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:storybook
      - name: Publish and compare Storybook
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "::error::Configure the CHROMATIC_PROJECT_TOKEN repository secret before publishing."
            exit 1
          fi
          npm run chromatic -- --no-interactive --exit-zero-on-changes
