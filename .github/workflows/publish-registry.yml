name: Publish npm package and MCP Registry entry

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  npm:
    # Maintainer-only: skipped on forks. Uses npm trusted publishing (OIDC), so no token is stored.
    if: github.repository == 'c-mongan/ireland-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm ci
      - name: Publish to npm unless this version already exists
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if npm view "ireland-mcp@${version}" version >/dev/null 2>&1; then
            echo "ireland-mcp@${version} is already on npm; skipping."
          else
            npm publish --provenance --access public
          fi

  publish:
    needs: npm
    # Maintainer-only: skipped on forks.
    if: github.repository == 'c-mongan/ireland-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
