version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # OpenTelemetry packages share a pinned @opentelemetry/api peer range, so a
      # lone bump fails npm ERESOLVE. Update them with the Azure Monitor distro,
      # which pins the runtime SDK (and therefore the api) version.
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
          - "@azure/monitor-opentelemetry"
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Functions runtime is Node 22; upgrade TypeScript majors deliberately.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
